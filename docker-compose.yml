# YSNB OJ — Compose 路线：postgres/redis/api/web 四件容器化。
# 判题机不进容器：沙箱需要直采宿主机 cgroup v2（容器套一层无隔离收益），
# 按宿主机 systemd 安装——见 docs/operations/deploy.md 方式 A 第 4 步。
# 密钥一律来自 .env（gitignored），复制 .env.example 填写，勿提交真实值。
name: ysnb-oj

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oj
      POSTGRES_USER: ${OJ_PG_USER}
      POSTGRES_PASSWORD: ${OJ_PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OJ_PG_USER} -d oj"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      OJ_MODE: prod
      OJ_LISTEN: ":8080"
      OJ_GRPC_ADDR: ":9090"
      OJ_DATA_DIR: /oj-data
      OJ_FETCH_BASE: ${OJ_FETCH_BASE}
      OJ_DB_DRIVER: postgres
      OJ_DB_DSN: "host=postgres user=${OJ_PG_USER} password=${OJ_PG_PASSWORD} dbname=oj sslmode=disable"
      OJ_REDIS_ADDR: "redis:6379"
      OJ_JWT_SECRET: ${OJ_JWT_SECRET}
      OJ_DAEMON_SECRET: ${OJ_DAEMON_SECRET}
      OJ_ADMIN_USERNAME: ${OJ_ADMIN_USERNAME}
      OJ_ADMIN_PASSWORD: ${OJ_ADMIN_PASSWORD}
      OJ_CLI_TOKEN: ${OJ_CLI_TOKEN:-}
    volumes:
      - ojdata:/oj-data
    # why loopback-published (not expose-only, not 0.0.0.0): three consumers
    # live on the HOST — the host-network web (proxy_pass 127.0.0.1:8080),
    # the host-side judge daemon (9090 gRPC + 8080 testdata fetch) and
    # one-click's health probe. Binding 127.0.0.1 keeps the security
    # invariant that the public cannot bypass the edge proxy (P0 review).
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/languages"]
      interval: 10s
      retries: 12
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # why host network: deploy/nginx.conf is shared VERBATIM with the
    # bare-metal route (proxy_pass 127.0.0.1:8080). Running web on the
    # compose bridge would make 127.0.0.1 point into the container (the
    # known 502) and force a second nginx config that must be kept in
    # lockstep with the security-header-heavy original — a drift hazard.
    # With host networking, 127.0.0.1:8080 is the api loopback-published
    # port above; port 80 is bound directly on the host.
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/opt/oj/web:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  ojdata:
