# YSNB OJ edge proxy: static SPA + API reverse proxy.
# Security headers here are the outer layer; the API adds its own set
# (backend internal/handler/security.go) so direct API callers are covered.
#
# NGINX PITFALL (found in the 2026-09-03 audit): add_header directives do
# NOT inherit into a location that declares ANY add_header of its own —
# the child list fully replaces the inherited one. Every location below
# that sets Cache-Control therefore REPEATS the security headers; do not
# "deduplicate" them away or static pages silently lose their headers.
server {
    listen 80;
    server_name _;
    client_max_body_size 128m;

    root /opt/oj/web;
    index index.html;

    # security headers (outer layer; backend sets the same set for /api/*)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self'" always;
    # enable after TLS: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # why no-cache on index.html: it is the only un-hashed entry point; with
    # heuristic caching browsers kept serving a stale index referencing an
    # old bundle after every deploy.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self'" always;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # why overwrite X-Forwarded-For (not append): a client-supplied XFF
        # would otherwise reach the backend and forge c.ClientIP(), defeating
        # the per-IP login/register rate limits (P0 in the security review).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        # ?token= would land in access logs; drop the query string there.
        access_log off;
    }

    # hashed assets are immutable per build
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # why no-cache here: "/" internally rewrites to index.html, bypassing the
    # exact-location block; the SPA entry must always revalidate or browsers
    # keep serving a stale index that references an old bundle after deploys.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self'" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}