[Service]
# Debian 12 (systemd 252) enables controllers in the root cgroup lazily
# during boot; the judge's preflight enables base-subtree controllers
# best-effort at startup and silently no-ops if root is not ready yet.
# Wait for root, enable there, then enable in the judge base — retried,
# non-fatal. Harmless (idempotent) on Debian 11 and alongside the
# retry-enabled preflight binary.
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 40 ]; do for c in memory pids cpu; do grep -qw $c /sys/fs/cgroup/cgroup.subtree_control || echo +$c >> /sys/fs/cgroup/cgroup.subtree_control; done; [ $(cat /sys/fs/cgroup/cgroup.subtree_control | wc -w) -ge 3 ] && break; sleep 0.5; i=$((i+1)); done; mkdir -p /sys/fs/cgroup/oj-judge; for c in memory pids cpu; do grep -qw $c /sys/fs/cgroup/oj-judge/cgroup.subtree_control 2>/dev/null || echo +$c > /sys/fs/cgroup/oj-judge/cgroup.subtree_control; done; exit 0'
